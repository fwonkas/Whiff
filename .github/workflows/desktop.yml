# Builds the Windows installer.
# - A version tag (v0.2.1, matching apps/desktop/package.json; `npm run release`
#   makes one) publishes a release: the installer, its blockmap and the
#   latest.yml that installed copies read to update themselves, with the commit
#   subjects since the previous tag as notes.
# - A manual run from the Actions tab is a test build: it goes on a draft
#   release for the version (re-running replaces its files), which installed
#   copies don't see, and tries a workflow artifact too.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # To delete older installer artifacts (below).
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history and tags, for the release notes.
          fetch-depth: 0
      - name: Check the tag matches the version
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json ($version)"
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build installer
        working-directory: apps/desktop
        run: node scripts/build.mjs && npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder uploads to a draft; a tag's draft is published here.
      - name: Publish the release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}$GITHUB_REF_NAME \
            | grep -v -e '^- Release [0-9]' -e '^- Initial commit$' > notes.md || true
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "Whiff ${GITHUB_REF_NAME#v}" --notes-file notes.md
      # Manual runs only, as a convenience: the installer is on the draft
      # release either way. Artifact storage can be full (quota hit again
      # 2026-11-12 with one installer stored), so a failed upload doesn't fail
      # the build.
      - uses: actions/upload-artifact@v6
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        with:
          name: Whiff-Installer
          path: apps/desktop/release/*.exe
          retention-days: 14
      # Each installer is ~120 MB; artifact storage filled up on 2026-11-08 when
      # the repo was private. Keep only the 3 newest.
      - name: Delete older installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?name=Whiff-Installer" -q '.artifacts[].id' \
            | tail -n +4 \
            | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
